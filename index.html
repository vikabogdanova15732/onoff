<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Состояние</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease;
        }
        
        /* Фон меняется в зависимости от состояния */
        body.on {
            background: #2ecc71;
        }
        
        body.off {
            background: #e74c3c;
        }
        
        /* Огромная надпись на весь экран */
        .status {
            font-size: 25vw;
            font-weight: 900;
            color: white;
            text-shadow: 0 10px 30px rgba(0,0,0,0.2);
            letter-spacing: 10px;
        }
    </style>
</head>
<body class="off">
    <div class="status" id="status">OFF</div>

    <script>
        const deviceId = Math.random().toString(36).substring(2, 8);
        
        function updateDisplay(state) {
            const statusDiv = document.getElementById('status');
            const body = document.body;
            
            statusDiv.textContent = state.toUpperCase();
            body.className = state;
            document.title = state.toUpperCase();
            
            console.log(`[${deviceId}] ${state.toUpperCase()}`);
        }
        
        function saveState(state) {
            localStorage.setItem('deviceState', state);
            localStorage.setItem('stateChangeTrigger', JSON.stringify({
                state: state,
                time: Date.now(),
                fromDevice: deviceId
            }));
        }
        
        function getSavedState() {
            const saved = localStorage.getItem('deviceState');
            return (saved === 'on' || saved === 'off') ? saved : 'off';
        }
        
        // Слушаем изменения от других вкладок/устройств
        window.addEventListener('storage', function(event) {
            if (event.key === 'stateChangeTrigger') {
                try {
                    const data = JSON.parse(event.newValue);
                    if (data.fromDevice !== deviceId) {
                        updateDisplay(data.state);
                    }
                } catch(e) {}
            }
        });
        
        // При загрузке страницы
        const path = window.location.pathname;
        
        if (path.includes('/on')) {
            saveState('on');
            updateDisplay('on');
        } else if (path.includes('/off')) {
            saveState('off');
            updateDisplay('off');
        } else {
            updateDisplay(getSavedState());
        }
    </script>
</body>
</html>
